services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: merya-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-8919995952:AAHj83TjuHvvqNulZPWdm-y7B0QDEN5yQms}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-6363932801}
      - RESET_NOTIFICATION_EMAIL=${RESET_NOTIFICATION_EMAIL:-marouataileb3@gmail.com}
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  backend_uploads:
    driver: local
