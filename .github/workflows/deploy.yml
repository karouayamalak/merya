name: Deploy Backend to Hostinger VPS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Executing remote SSH commands
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Starting backend deployment..."
            
            # Navigate to project directory (supports either /var/www/merya or ~/merya)
            if [ -d "/var/www/merya" ]; then
              cd /var/www/merya
            elif [ -d "$HOME/merya" ]; then
              cd "$HOME/merya"
            else
              echo "❌ Error: Project directory not found in /var/www/merya or ~/merya"
              exit 1
            fi

            echo "📥 Pulling latest code from GitHub..."
            git pull origin main

            echo "🐳 Rebuilding and updating Docker container..."
            docker compose up -d --build backend

            echo "🧹 Removing old unused Docker images..."
            docker image prune -f

            echo "🔍 Verifying running container..."
            docker ps --filter "name=merya-api"

            echo "✅ Deployment completed successfully!"
